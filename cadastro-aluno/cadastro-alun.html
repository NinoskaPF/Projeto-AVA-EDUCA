<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro AVA-EDUCA +</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="./cadastro-alun.css">

    <script src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"></script>

</head>

<body>
    <header>

        <div class="logo-area">
            <img src="../assets/images/logo-ava-educa.png" alt="Logo AVA-EDUCA+">
            <h1>AVA-EDUCA+</h1>
        </div>

        <p id="usuario-logado"></p>

    </header>
    <div class="layout">
        <aside class="menu-lateral">

            <nav>

                <button type="button" id="btn-dashboard">
                    🏠 Dashboard
                </button>

                <button type="button" id="btn-cursos" disabled>
                    📚 Cursos
                </button>

                <button type="button" id="btn-alunos">
                    👨‍🎓 Cadastro de Aluno
                </button>

                <button type="button" id="btn-sair">
                    🚪 Sair
                </button>

            </nav>

        </aside>
        <main>

            <h2>Cadastro de Aluno</h2>
            <section>
                <form id="form-aluno">
                    <div>
                        <label for="nome">Nome</label> <input type="text" id="nome" name="nome" minlength="4" maxlength="80"required>
                    </div>
                    <div>
                        <label for="genero">Gênero</label>
                        <select id="genero" name="genero" required>
                            <option value="">Selecione</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Outro">Outro</option>
                            <option value="No">Escolho não informar</option>
                        </select>
                    </div>
                    <div>
                        <label for="email">E-mail</label> <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="cpf">CPF</label> <input type="text" id="cpf" name="cpf" required>
                    </div>
                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>
                    <div>
                        <label for="dataNascimento">Data de nascimento</label> <input type="date" id="dataNascimento"
                            name="dataNascimento" required>
                    </div>


                    <h3>Endereço</h3>

                    <div>
                        <label for="cep">CEP</label> <input type="text" id="cep" name="cep" required>
                    </div>
                    <div>
                        <label for="logradouro">Logradouro</label> <input type="text" id="logradouro" name="logradouro"
                            required readonly>
                    </div>
                    <div>
                        <label for="bairro">Bairro</label> <input type="text" id="bairro" name="bairro" required readonly>
                    </div>
                    <div>
                        <label for="cidade">Cidade</label> <input type="text" id="cidade" name="cidade"  required readonly>
                    </div>
                    <div>
                        <label for="estado">Estado</label> <input type="text" id="estado" name="estado" required readonly>
                    </div>
                    <div>
                        <label for="numero">Número</label>
                        <input type="number" id="numero" name="numero" required>
                    </div>

                    <div>
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" name="complemento">
                    </div>

                    <button type="submit">Cadastrar aluno</button>

                    <p id="mensagem"></p>

                </form>
            </section>
        </main>

    </div>
    <script type="module" src="../js/geral.js"></script>
    <script type="module" src="./cadastro-alun.js"></script>
</body>

</html>
